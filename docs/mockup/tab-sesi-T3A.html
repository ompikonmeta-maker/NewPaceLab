<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup: tab Sesi</title>
<style>
:root{--bg:#f3f3f1;--surface:#fdfdfc;--line:#e3e2de;--grid:#ebeae6;--text:#111110;--text-2:#45443f;--muted:#6b6a65;--t:#2a78d6;--r:#eb6834;
  --good:#0f8a0f;--good-bg:#e6f4e4;--warn:#9a6a00;--warn-bg:#fdf3dc;--serious:#b54a1f;--serious-bg:#fbe9e0;
  --z1:#dcdcd6;--z2:#b4b3ab;--z3:#8a8981;--z4:#5c5b55;--z5:#2c2b28;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.4,.64,1)}
@media (prefers-color-scheme:dark){:root{--bg:#111110;--surface:#1b1b1a;--line:#2e2e2c;--grid:#272725;--text:#f2f1ee;--text-2:#cfcec6;--muted:#a3a29b;--t:#3987e5;--r:#d95926;
  --good:#5fd35f;--good-bg:#173317;--warn:#f2c14e;--warn-bg:#3a2f12;--serious:#f0956d;--serious-bg:#3b2318;
  --z1:#3a3a37;--z2:#5a5a55;--z3:#86857e;--z4:#b5b4ac;--z5:#e6e5df}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none} .dot.t{background:var(--t)} .dot.r{background:var(--r)}
.muted{color:var(--muted)}
/* mockup controls (not part of the design) */
.mc{position:sticky;top:0;z-index:90;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px dashed var(--line);padding:8px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.mc b{color:var(--text)} .mc .grp{display:inline-flex;gap:2px;background:var(--grid);border-radius:9px;padding:2px}
.mc button{border:0;background:none;font:inherit;font-weight:600;color:var(--text-2);padding:4px 10px;border-radius:7px;cursor:pointer}
.mc button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
main{max-width:1180px;margin:0 auto;padding:22px 20px 140px}

/* ===== header (stays when switching tabs) ===== */
.hd{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{color:var(--muted);font-size:14px} .count{display:flex;align-items:baseline;gap:10px} .count b{font-size:76px;line-height:1;font-weight:750;letter-spacing:-.04em} .count span{font-size:20px;color:var(--text-2)}
.sub{color:var(--text-2);font-size:15px;margin-top:4px} .sub b{color:var(--text)}
.togs{display:flex;gap:8px;align-items:center;height:44px}
.tog{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 8px;font-weight:700;font-size:14px}
.tog i{width:30px;height:18px;border-radius:9px;position:relative} .tog i::after{content:"";position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff}
.trk{position:relative;height:96px;margin-top:10px}
.trk .rail{position:absolute;left:0;right:0;top:66px;height:8px;border-radius:4px;background:var(--grid);overflow:hidden}
.trk .rail i{position:absolute;inset:0 63% 0 0;background:linear-gradient(90deg,color-mix(in srgb,var(--t) 70%,var(--surface)),color-mix(in srgb,var(--r) 70%,var(--surface)));border-radius:4px}
.trk svg{position:absolute;left:37%;top:14px;transform:translateX(-50%);overflow:visible}
.trk .tag{position:absolute;left:37%;top:-6px;transform:translateX(-50%);background:var(--text);color:var(--surface);font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px}
.terr{display:flex;gap:3px;align-items:flex-end;height:46px;margin-top:2px}
.terr i{flex:1;border-radius:2px 2px 0 0;opacity:.85} .terr i.f{opacity:.28}

/* ===== tabs: three options ===== */
.tabs{margin:26px 0 16px;position:relative}
/* T1: big title tabs with sliding underline (as sketched) */
.t1{display:flex;gap:28px;align-items:flex-end;border-bottom:1px solid var(--line)}
.t1 button{border:0;background:none;font:inherit;font-size:24px;font-weight:700;letter-spacing:-.02em;color:var(--muted);padding:0 0 10px;cursor:pointer;transition:color .3s}
.t1 button[aria-selected="true"]{color:var(--text)} .t1 button:hover{color:var(--text-2)}
.t1 .ul{position:absolute;bottom:-1px;height:3px;border-radius:2px;background:var(--text);transition:transform .45s var(--spring),width .45s var(--spring)}
.t1 .cnt{font-size:12px;font-weight:700;vertical-align:super;margin-left:3px;color:var(--muted)}
/* T2: segmented pill */
.t2{display:inline-flex;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.t2 button{position:relative;z-index:1;border:0;background:none;font:inherit;font-size:16px;font-weight:700;color:var(--text-2);padding:8px 22px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:8px}
.t2 button[aria-selected="true"]{color:var(--surface)} .t2 .pill{position:absolute;top:4px;bottom:4px;border-radius:10px;background:var(--text);transition:transform .45s var(--spring),width .45s var(--spring)}
.t2 svg{width:17px;height:17px}
/* T3: sticky mini-header with tabs (appears when the big header scrolls away) */
.mini{position:fixed;left:0;right:0;top:0;z-index:80;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  transform:translateY(-110%);transition:transform .45s var(--ease)}
.mini.on{transform:none}
.mini .in{max-width:1180px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;gap:18px}
.mini .cd{font-weight:750;font-size:20px;letter-spacing:-.02em} .mini .cd small{font-size:12.5px;font-weight:500;color:var(--muted);margin-left:4px}
.mini .bar{flex:1;height:6px;border-radius:3px;background:var(--grid);position:relative;max-width:360px}
.mini .bar i{position:absolute;inset:0 63% 0 0;border-radius:3px;background:linear-gradient(90deg,var(--t),var(--r))}
.mini .bar svg{position:absolute;left:37%;top:-17px;transform:translateX(-50%)}
.mini .t1s{display:flex;gap:4px;margin-left:auto} .mini .t1s button{border:0;background:none;font:inherit;font-weight:700;color:var(--muted);padding:6px 12px;border-radius:9px;cursor:pointer}
.mini .t1s button[aria-selected="true"]{color:var(--text);background:var(--bg)}
/* panels slide between tabs */
.panes{position:relative}
.pane{transition:opacity .3s,transform .45s var(--ease)} .pane.hide{display:none} .pane.out{opacity:0;transform:translateX(-24px)} .pane.in0{opacity:0;transform:translateX(24px)}
.ph{border:1px dashed var(--line);border-radius:20px;padding:40px;text-align:center;color:var(--muted)}

/* ===== common pieces ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 20px}
.h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 0 12px;flex-wrap:wrap}
.h h3{margin:0;font-size:19px} .h p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.term{border-bottom:1.5px dotted var(--muted);cursor:help}
.tip{position:fixed;z-index:200;pointer-events:none;max-width:300px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--text-2);
  box-shadow:0 14px 40px rgba(0,0,0,.16);opacity:0;transform:translateY(4px) scale(.98);transition:opacity .15s,transform .25s var(--spring)}
.tip.on{opacity:1;transform:none} .tip b{color:var(--text)} .tip .t1x{display:block;font-weight:650;color:var(--text);font-size:13.5px;margin-bottom:2px}
.tip .f{display:block;margin-top:6px;padding:6px 8px;border-radius:8px;background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums}
.tip .r2{display:flex;justify-content:space-between;gap:14px} .tip .r2 span:first-child{color:var(--muted)}
.shape{display:inline-block;vertical-align:middle}

/* duel detail (shared by all options) — everything mirrored around a centre spine */
.det{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--ease)} .det.open{grid-template-rows:1fr} .det > div{overflow:hidden}
.dd{padding-top:14px;opacity:0;transform:translateY(8px);transition:opacity .35s .1s,transform .5s .1s var(--ease)} .det.open .dd{opacity:1;transform:none}
.mir{display:grid;grid-template-columns:minmax(0,1fr) 116px minmax(0,1fr);align-items:center;column-gap:10px}
.mir > .c{text-align:center;font-size:12.5px;color:var(--muted)}
.vrow{padding:7px 0;border-top:1px solid var(--line)}
.vrow{padding:0}
.vrow .L,.vrow .R{display:flex;align-items:center;gap:12px}
.vrow .v{flex:none;width:96px;font-size:18px;font-weight:650;white-space:nowrap} .vrow .L .v{text-align:right} .vrow .v small{font-size:12px;font-weight:400;color:var(--muted)}
.vrow .bb{flex:1;height:38px;position:relative} .vrow .L .bb{border-right:1.5px dashed var(--line)} .vrow .R .bb{border-left:1.5px dashed var(--line)}
.vrow .bb i{position:absolute;top:50%;height:6px;margin-top:-3px;border-radius:3px;width:0;transition:width .9s var(--ease),opacity .3s}
.vrow .L .bb i{right:0;border-radius:3px 0 0 3px} .vrow .R .bb i{left:0;border-radius:0 3px 3px 0}
.vrow .lose .bb i{opacity:.3} .vrow .tie .bb i{opacity:.6}
.sec{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;text-align:center}
.sec .s2{font-weight:400;text-transform:none;letter-spacing:0}
/* butterfly splits: km rows, Taofik grows left, Reza grows right */
.bf{display:grid;grid-template-columns:minmax(0,1fr) 116px minmax(0,1fr);row-gap:3px;column-gap:10px}
.bf .km{text-align:center;font-size:11px;color:var(--muted);line-height:16px}
.bf .s{position:relative;height:16px}
.bf .s .band{position:absolute;top:-2px;bottom:-2px;opacity:.12;border-radius:3px}
.bf .s .b{position:absolute;top:2px;bottom:2px;border-radius:3px;transform:scaleX(0);transition:transform .7s var(--ease)}
.bf .s.L .b{right:0;transform-origin:right} .bf .s.R .b{left:0;transform-origin:left}
.det.open .bf .s .b{transform:scaleX(1)}
.bf .s .hr{position:absolute;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--surface);border:2px solid var(--text);opacity:0;transition:opacity .3s .8s}
.det.open .bf .s .hr{opacity:1}
.bf .s .pv{position:absolute;top:0;font-size:10.5px;line-height:16px;color:var(--muted);opacity:0;transition:opacity .2s} .bf .row:hover .pv{opacity:1}
.bf .row{display:contents}
.bf .row:hover .km{color:var(--text);font-weight:700}
.bfs{display:block;overflow:visible} .bfs text{font-size:10.5px;fill:var(--muted)}
.bfs .bfb{transform-box:fill-box;transform:scaleX(0)} .det.open .bfs .bfb{animation:grx .7s var(--ease) forwards} @keyframes grx{to{transform:scaleX(1)}}
.bfs .bfl{fill:none;stroke-width:1.8;stroke-linejoin:round;stroke-dasharray:2000;stroke-dashoffset:2000} .det.open .bfs .bfl{animation:dr 1.6s .4s var(--ease) forwards} @keyframes dr{to{stroke-dashoffset:0}}
.bfs .bfh{fill:transparent} .bfs .bfh:hover{fill:color-mix(in srgb,var(--text) 5%,transparent)}
.lt{display:flex;justify-content:center;gap:6px;margin:-2px 0 10px;flex-wrap:wrap}
.lt button{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 12px 3px 10px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .25s}
.lt button::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;transition:background .25s}
.lt button[aria-pressed="true"]{color:var(--text);border-color:var(--text)} .lt button[aria-pressed="true"]::before{background:currentColor}
.bfs .bfa{fill:var(--muted);opacity:.12}
.bfk{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap} .bfk i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
/* mirrored zone bars */
.zb{display:flex;height:20px;border-radius:6px;overflow:hidden;gap:2px} .zb.L{flex-direction:row-reverse}
.zb span{width:0;transition:width 1s var(--ease);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}
/* coach checklist, mirrored */
.ck .crow{padding:6px 0;border-top:1px solid var(--line)}
.ck .L,.ck .R{display:flex;align-items:center;gap:8px;font-size:13.5px} .ck .L{justify-content:flex-end;text-align:right}
.ck .L .val,.ck .R .val{color:var(--text-2)} .ck svg{width:18px;height:18px;flex:none}
.ok{color:var(--good)} .wn{color:var(--warn)} .na{color:var(--muted)}
.verdict{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:16px}
.vd{border-radius:14px;padding:10px 14px;background:var(--bg);font-size:13.5px;color:var(--text-2)} .vd.L{text-align:right}
.vd b{color:var(--text)} .vd svg{width:14px;height:14px;vertical-align:-2px;margin:0 5px;color:var(--warn)}
.ringc .tr{stroke:var(--grid)} .ringc .v{stroke-dasharray:0 200;transition:stroke-dasharray 1.1s var(--ease)} .ringc text{font:700 12.5px "Segoe UI",system-ui;fill:var(--text)}
.dtop{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}
.dtop .who{display:flex;align-items:center;gap:12px} .dtop .who.R{justify-content:flex-end;text-align:right}
.dtop .who b{font-size:17px} .dtop .who small{display:block;color:var(--muted);font-size:12.5px}
.dtop .mid{text-align:center} .dtop .mid b{display:block;font-size:16px} .dtop .mid span{font-size:13px;color:var(--muted)}

/* ===== option A: mirrored feed (vertical spine) ===== */
.feed{position:relative}
.feed::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--grid)}
.fr{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 150px minmax(0,1fr);align-items:center;gap:14px;padding:6px 0;cursor:pointer}
.fr .sp{text-align:center;position:relative;z-index:1} .fr .sp b{display:block;font-size:13px} .fr .sp span{font-size:11.5px;color:var(--muted)}
.fr .sp .ic{width:34px;height:34px;margin:0 auto 2px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;transition:transform .3s var(--spring)}
.fr:hover .sp .ic{transform:scale(1.1)}
.sc{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 14px;transition:transform .3s var(--spring),box-shadow .3s;opacity:0;transform:translateY(8px)}
.sc.in{animation:rise .5s var(--ease) forwards;animation-delay:calc(var(--i) * 45ms)} @keyframes rise{to{opacity:1;transform:none}}
.fr:hover .sc{box-shadow:0 8px 24px rgba(0,0,0,.07)}
.sc.L{flex-direction:row-reverse;text-align:right} .sc .km{font-size:20px;font-weight:700;letter-spacing:-.01em} .sc .km small{font-size:12px;font-weight:400;color:var(--muted)}
.sc .meta{font-size:12.5px;color:var(--muted);line-height:1.35} .sc .sp2{flex:1}
.sc.ghost{border-style:dashed;background:transparent;color:var(--muted);font-size:13px;justify-content:center}
.sc.fut{border-style:dashed;background:transparent}
.fr.today .sp b{color:var(--text)} .fr.today .sp .ic{border-color:var(--text);box-shadow:0 0 0 3px color-mix(in srgb,var(--text) 10%,transparent)}
.fx{grid-column:1/-1;position:relative;z-index:1;background:var(--bg)}
.wg{position:relative;margin-bottom:6px}
.wgh{position:relative;z-index:1;width:100%;display:grid;grid-template-columns:minmax(0,1fr) 210px minmax(0,1fr);align-items:center;gap:14px;border:0;background:none;font:inherit;color:inherit;cursor:pointer;padding:8px 0}
.wgh .wm{justify-self:center;display:flex;flex-direction:column;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px 16px;transition:border-color .2s,box-shadow .2s}
.wgh:hover .wm{border-color:var(--text-2);box-shadow:0 4px 14px rgba(0,0,0,.06)} .wgh .wm b{font-size:13.5px} .wgh .wm span{font-size:12px;color:var(--muted)}
.wgh .cv{margin-top:2px;color:var(--muted);transition:transform .35s var(--ease)} .wg.open .wgh .cv{transform:rotate(180deg)}
.wgh .ws{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--muted)} .wgh .ws.L{justify-content:flex-end} .wgh .ws b{font-size:16px;color:var(--text)}
.wg:not(.open) .wgh .ws{opacity:1} .wg.open .wgh .ws{opacity:.55}
.wgb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)} .wg.open .wgb{grid-template-rows:1fr} .wgb > div{overflow:hidden}
.wkh{position:relative;z-index:1;text-align:center;margin:18px 0 8px} .wkh span{background:var(--bg);padding:3px 12px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--text-2)}

/* ===== option B: ribbon ===== */
.rib{display:flex} .rib .names{flex:none;width:76px;position:relative} .rib .names div{position:absolute;left:0;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;transform:translateY(-50%)}
.rib .scx{flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24px)} .rib .scx::-webkit-scrollbar{display:none}
.rib svg{display:block;overflow:visible}
.rib .lane{stroke:var(--grid);stroke-width:1.5;stroke-dasharray:2 5} .rib .wk{stroke:var(--line)} .rib .dl{font-size:11px;fill:var(--muted);text-anchor:middle} .rib .dl.td{fill:var(--text);font-weight:700}
.rib .col{fill:transparent;cursor:pointer} .rib .col:hover{fill:color-mix(in srgb,var(--text) 5%,transparent)} .rib .col.sel{fill:color-mix(in srgb,var(--text) 8%,transparent)}
.mk{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .55s var(--spring) forwards;cursor:pointer} @keyframes pop{to{transform:scale(1)}}

/* ===== option C: coach report ===== */
.wkc{margin-bottom:14px}
.wkc .hh{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}
.grade{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1} .grade small{display:block;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:0}
.hh .L{text-align:right} .hh .mid{text-align:center} .hh .mid b{display:block} .hh .mid span{font-size:12.5px;color:var(--muted)}
.pil{margin-top:10px}
.pil .prow{padding:5px 0}
.pil .bar2{height:10px;border-radius:5px;background:var(--grid);position:relative;overflow:hidden} .pil .bar2 i{position:absolute;top:0;bottom:0;width:0;border-radius:5px;transition:width 1s var(--ease)}
.pil .L .bar2 i{right:0} .pil .R .bar2 i{left:0}
.pil .L,.pil .R{display:flex;align-items:center;gap:8px} .pil .L{flex-direction:row-reverse} .pil .L .pv,.pil .R .pv{font-size:12.5px;font-weight:700;width:34px} .pil .L .pv{text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px} .chips.L{justify-content:flex-end}
.chip2{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px;font-size:12.5px;cursor:pointer;background:var(--surface);transition:transform .25s var(--spring)}
.chip2:hover{transform:translateY(-2px)} .chip2.miss{border-style:dashed;color:var(--muted)}
.cnote{font-size:13.5px;color:var(--text-2);margin-top:8px} .cnote.L{text-align:right}

/* ===== Arah (trends) ===== */
.tg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px 10px}
.tc h4{margin:0 0 6px;font-size:14px;text-align:center}
.tc .mirx{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tc .sideT,.tc .sideR{display:flex;flex-direction:column} .tc .sideT{align-items:flex-end;text-align:right}
.tc .nv{font-size:19px;font-weight:700;letter-spacing:-.01em} .tc .dlt{font-size:12px;font-weight:700} .dlt.up{color:var(--good)} .dlt.dn{color:var(--serious)} .dlt.eq{color:var(--muted)}
.tc svg{display:block;width:100%;height:64px;overflow:visible;margin-top:4px}
.tc .ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
