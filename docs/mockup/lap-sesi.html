<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup: lap di detail sesi</title>
<style>
:root{--bg:#f3f3f1;--surface:#fdfdfc;--line:#e3e2de;--grid:#ebeae6;--text:#111110;--text-2:#45443f;--muted:#6b6a65;--t:#2a78d6;--r:#eb6834;--warn:#9a6a00;--warn-bg:#fdf3dc;--ease:cubic-bezier(.22,1,.36,1)}
@media (prefers-color-scheme:dark){:root{--bg:#111110;--surface:#1b1b1a;--line:#2e2e2c;--grid:#272725;--text:#f2f1ee;--text-2:#cfcec6;--muted:#a3a29b;--t:#3987e5;--r:#d95926;--warn:#f2c14e;--warn-bg:#3a2f12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:22px;margin:0 0 4px} p.sub{color:var(--muted);margin:0 0 14px;font-size:13.5px}
.num{font-variant-numeric:tabular-nums}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--text-2);border-radius:999px;padding:5px 13px;font:inherit;font-size:13px;cursor:pointer}
.pill[aria-pressed=true]{background:var(--text);color:var(--surface);border-color:var(--text)}
.note{font-size:13px;color:var(--text-2);margin:4px 0 14px;min-height:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.sec{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.05em}
.seg{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px}
.seg button{border:0;background:none;font:inherit;font-size:13px;padding:4px 14px;border-radius:8px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.leg{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px} .leg span{display:inline-flex;align-items:center;gap:6px}
svg text{font-size:11.5px;fill:var(--muted)}
.tt{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 28px rgba(0,0,0,.12);border-radius:12px;padding:8px 12px;font-size:12.5px;white-space:nowrap;opacity:0;transition:opacity .12s;z-index:9}
.tt.on{opacity:1} .tt b{font-size:14px}
/* L3 table */
.tb{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tb table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.tb th{color:var(--muted);font-weight:600;text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)} .tb td{text-align:right;padding:4px 6px;border-bottom:1px solid var(--grid)}
.tb .L th:first-child,.tb .L td:first-child{text-align:left}
.tb tr.thin td{color:var(--muted)} .tb tr:hover td{background:var(--bg)}
.tb .pb{display:inline-block;height:6px;border-radius:3px;vertical-align:middle;margin-right:6px}
.ic{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:6px;background:var(--bg);color:var(--muted)}
.ic.m{background:var(--warn-bg);color:var(--warn)}
.tb h4{margin:0 0 6px;display:flex;align-items:center;gap:6px}
.dt{display:inline-block;width:9px;height:9px;border-radius:50%}
.ck{margin-top:14px;font-size:13px;color:var(--text-2);background:var(--bg);border-radius:12px;padding:10px 14px}
@media (max-width:700px){.tb{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>Mockup: lap asli di detail sesi</h1>
<p class="sub">Data rekaan meniru struktur Selasa 27 Okt (Taofik 12 lap: 2 auto-lap, 3 lap manual ±160 m, tempo 3 × 1 km, 3 auto-lap, sisa 14 m; Reza 6 lap dari workout terstruktur). Lap dibaca dari file FIT jam; per km tetap ada sebagai cadangan.</p>
<div class="pills" id="opt" role="group" aria-label="Opsi">
  <button class="pill" aria-pressed="true" data-o="L1">L1 Sumbu jarak (blok setinggi jarak lap)</button>
  <button class="pill" aria-pressed="false" data-o="L2">L2 Satu baris per lap</button>
  <button class="pill" aria-pressed="false" data-o="L3">L3 Tabel cermin</button>
</div>
<p class="note" id="note"></p>
<div class="card">
  <div class="hd"><span class="sec">LAP</span><div class="seg" role="group" aria-label="Potongan"><button aria-pressed="true" data-v="lap">Lap jam</button><button aria-pressed="false" data-v="km">Per km</button></div></div>
  <div id="ch"></div>
  <div class="leg" id="leg"></div>
  <div class="ck" id="ck"></div>
</div>
</div>
<div class="tt" id="tt"></div>
<script>
const $ = id => document.getElementById(id);
const P = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;
// [km, seconds, HR, cadence, trigger]   trigger: a = auto-lap per km, m = tombol lap, w = langkah workout, e = akhir sesi
const LAPS = {
  t: [[1, 523, 132, 168, "a"], [1, 519, 132, 172, "a"], [.158, 81, 140, 136, "m"], [.156, 81, 137, 142, "m"], [.163, 81, 135, 136, "m"],
      [1, 371, 154, 174, "a"], [1, 355, 165, 180, "a"], [1, 350, 168, 178, "a"], [1, 514, 153, 170, "a"], [1, 541, 152, 170, "a"], [1, 558, 151, 170, "a"], [.014, 9, 151, 120, "e"]],
  r: [[2, 1050, 140, 170, "w"], [1, 438, 158, 174, "w"], [1, 434, 162, 175, "w"], [1, 432, 165, 176, "w"], [2, 1080, 150, 171, "w"], [.9, 480, 148, 170, "e"]]};
const PLAN = {t: [360, 370], r: [430, 440]}, NAME = {t: "Taofik", r: "Reza"}, TRIG = {a: "auto-lap 1 km", m: "tombol lap", w: "langkah workout", e: "akhir sesi"};
// per km from the laps (for the fallback view)
function perKm(L) { const out = []; let acc = 0, sec = 0, hr = 0, w = 0;
  L.forEach(([km, s, h]) => { let left = km, ps = s / km; while (left > 1e-6) { const take = Math.min(1 - acc, left); acc += take; sec += take * ps; hr += h * take; w += take; left -= take;
      if (acc >= .999) { out.push([1, sec, Math.round(hr / w), 0, "k"]); acc = 0; sec = 0; hr = 0; w = 0; } } });
  if (acc >= .3) out.push([acc, sec, Math.round(hr / w), 0, "k"]); return out; }
let OPT = "L1", VIEW = "lap";
const NOTE = {L1: "Sumbu tegak = jarak (km 0 di atas). Tiap lap jadi blok setinggi jaraknya, lebar = kecepatan. Kedua pelari sejajar per km, jadi tempo Taofik dan Reza bisa dibandingkan di km yang sama. Lap 160 m tampil tipis; sentuh untuk detail.",
  L2: "Satu baris per lap, tinggi sama. Lap pendek tetap mudah disentuh dan dibaca; nomor lap di tiap sisi. Kedua sisi tidak sejajar per km bila jumlah lap berbeda.",
  L3: "Tabel lap seperti di aplikasi Garmin, berdampingan: jarak, waktu, pace (dengan batang kecil), HR, cadence, asal lap."};
const tt = $("tt"), tip = (e, html) => { if (!html) return tt.classList.remove("on"); tt.innerHTML = html; tt.style.left = Math.min(innerWidth - 220, e.clientX + 14) + "px"; tt.style.top = (e.clientY - 10) + "px"; tt.classList.add("on"); };
const lapTip = (c, i, l) => `<span class="dt" style="background:var(--${c})"></span> ${NAME[c]} · ${VIEW === "lap" ? "lap" : "km"} ${i + 1}<br><b class="num">${P(l[1] / l[0])}/km</b> · ${l[0] >= 1 ? l[0].toFixed(2) + " km" : Math.round(l[0] * 1000) + " m"} · ${P(l[1])}<br>${l[2]} bpm${l[3] ? " · " + l[3] + " spm" : ""}${VIEW === "lap" ? `<br><span style="color:var(--muted)">${TRIG[l[4]]}</span>` : ""}`;
function data() { return VIEW === "lap" ? LAPS : {t: perKm(LAPS.t), r: perKm(LAPS.r)}; }
function speedScale(D) { const all = [...D.t, ...D.r].filter(l => l[0] >= .1).map(l => l[1] / l[0]).concat(PLAN.t, PLAN.r); return [Math.max(...all) + 25, Math.min(...all) - 10]; }
function L1() { const D = data(), W = Math.min(1100, $("ch").clientWidth), mid = 70, sw = (W - mid) / 2, [slow, fast] = speedScale(D), len = p => Math.max(4, (slow - p) / (slow - fast) * (sw - 96));
  const tot = Math.max(...["t", "r"].map(c => D[c].reduce((q, l) => q + l[0], 0))), K = 46, H = tot * K + 20, Y = km => 10 + km * K;
  let g = ""; for (let k = 0; k <= Math.ceil(tot); k++) g += `<line x1="0" x2="${W}" y1="${Y(k)}" y2="${Y(k)}" stroke="var(--grid)"/><text x="${W / 2}" y="${Y(k) + 4}" text-anchor="middle">${k} km</text>`;
  for (const c of ["t", "r"]) { const L = c === "t", x0 = L ? sw : sw + mid, pl = PLAN[c];
    g += `<rect x="${L ? x0 - len(pl[0]) : x0 + len(pl[1])}" y="${Y(0)}" width="${Math.abs(len(pl[0]) - len(pl[1]))}" height="${tot * K}" rx="4" fill="var(--${c})" opacity=".1"/>`;
    let at = 0; D[c].forEach((l, i) => { const w = len(l[1] / l[0]), y = Y(at), h = Math.max(2, l[0] * K - 2); at += l[0];
      g += `<rect class="b" data-c="${c}" data-i="${i}" x="${L ? x0 - w : x0}" y="${y + 1}" width="${w}" height="${h}" rx="${Math.min(4, h / 2)}" fill="var(--${c})" opacity="${l[4] === "m" || l[4] === "e" ? .55 : .9}"/>`;
      if (h > 16) g += `<text x="${L ? x0 - w - 6 : x0 + w + 6}" y="${y + h / 2 + 5}" text-anchor="${L ? "end" : "start"}" style="fill:var(--text-2)">${VIEW === "lap" ? "lap " + (i + 1) + " · " : ""}${P(l[1] / l[0])}</text>`; }); }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${g}</svg>`; }
function L2() { const D = data(), W = Math.min(1100, $("ch").clientWidth), mid = 70, sw = (W - mid) / 2, [slow, fast] = speedScale(D), len = p => Math.max(4, (slow - p) / (slow - fast) * (sw - 90));
  const n = Math.max(D.t.length, D.r.length), RH = 24, H = n * RH + 8;
  let g = "";
  for (const c of ["t", "r"]) { const L = c === "t", x0 = L ? sw : sw + mid, pl = PLAN[c];
    g += `<rect x="${L ? x0 - len(pl[0]) : x0 + len(pl[1])}" y="2" width="${Math.abs(len(pl[0]) - len(pl[1]))}" height="${n * RH}" rx="4" fill="var(--${c})" opacity=".1"/>`;
    D[c].forEach((l, i) => { const w = len(l[1] / l[0]), y = 4 + i * RH;
      g += `<rect class="b" data-c="${c}" data-i="${i}" x="${L ? x0 - w : x0}" y="${y}" width="${w}" height="${RH - 7}" rx="3" fill="var(--${c})" opacity="${l[4] === "m" || l[4] === "e" ? .55 : .9}"/>
        <text x="${L ? x0 - w - 6 : x0 + w + 6}" y="${y + 13}" text-anchor="${L ? "end" : "start"}" style="fill:var(--text-2)">${P(l[1] / l[0])}${l[0] < .95 ? ` · ${Math.round(l[0] * 1000)} m` : l[0] > 1.05 ? ` · ${l[0]} km` : ""}</text>
        <text x="${L ? sw + 8 : sw + mid - 8}" y="${y + 13}" text-anchor="${L ? "start" : "end"}">${i + 1}</text>`; }); }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${g}</svg>`; }
function L3() { const D = data(), [slow, fast] = speedScale(D);
  const tab = c => `<div class="${c === "t" ? "L" : ""}"><h4><span class="dt" style="background:var(--${c})"></span>${NAME[c]}</h4><table><thead><tr><th>${VIEW === "lap" ? "Lap" : "Km"}</th><th>Jarak</th><th>Waktu</th><th>Pace</th><th>HR</th>${VIEW === "lap" ? "<th>Spm</th><th></th>" : ""}</tr></thead><tbody>
    ${D[c].map((l, i) => `<tr class="${l[0] < .5 ? "thin" : ""}" data-c="${c}" data-i="${i}"><td>${i + 1}</td><td>${l[0] >= 1 ? l[0].toFixed(2) + " km" : Math.round(l[0] * 1000) + " m"}</td><td>${P(l[1])}</td>
      <td><span class="pb" style="width:${Math.max(4, (slow - l[1] / l[0]) / (slow - fast) * 60)}px;background:var(--${c})"></span>${P(l[1] / l[0])}</td><td>${l[2]}</td>${VIEW === "lap" ? `<td>${l[3]}</td><td><span class="ic ${l[4] === "m" ? "m" : ""}">${{a: "auto", m: "manual", w: "workout", e: "akhir"}[l[4]]}</span></td>` : ""}</tr>`).join("")}</tbody></table></div>`;
  return `<div class="tb">${tab("t")}${tab("r")}</div>`; }
function render() { tip(null); $("ch").innerHTML = {L1, L2, L3}[OPT]();
  $("leg").innerHTML = OPT === "L3" ? "" : `<span><svg width="14" height="10"><rect width="14" height="10" rx="2" fill="var(--muted)"/></svg>${VIEW === "lap" ? "lap (lebar = kecepatan)" : "km (lebar = kecepatan)"}</span><span><svg width="14" height="10"><rect width="14" height="10" rx="2" fill="var(--muted)" opacity=".5"/></svg>lap manual / sisa akhir</span><span><svg width="14" height="10"><rect width="14" height="10" rx="2" fill="var(--muted)" opacity=".18"/></svg>pita = rentang pace rencana</span>`;
  $("ck").innerHTML = VIEW === "lap" ? `<b>Penilaian pelatih memakai lap bila ada:</b> tempo Taofik dinilai dari lap 6–8 (6:11 · 5:55 · 5:50) bukan dari km 3–5; pemanasan dari lap sebelum tempo. Tanpa file FIT, kembali ke per km.` : `Per km dihitung dari data per detik (cadangan bila file FIT tidak ada).`;
  document.querySelectorAll("#ch .b, #ch tr[data-c]").forEach(el => { const c = el.dataset.c, i = +el.dataset.i; el.onpointermove = e => tip(e, lapTip(c, i, data()[c][i])); el.onpointerleave = () => tip(null); }); }
$("opt").addEventListener("click", e => { const b = e.target.closest("[data-o]"); if (!b) return; $("opt").querySelectorAll(".pill").forEach(p => p.setAttribute("aria-pressed", p === b)); OPT = b.dataset.o; $("note").textContent = NOTE[OPT]; render(); });
document.querySelector(".seg").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (!b) return; document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b)); VIEW = b.dataset.v; render(); });
$("note").textContent = NOTE.L1; render(); addEventListener("resize", render);
</script>
</body></html>
